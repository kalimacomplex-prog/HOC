<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>HOC - Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    html {
      min-height: 100%;
      background:
        radial-gradient(900px 520px at 12% 8%, rgba(47,92,255,.055), transparent 70%),
        radial-gradient(800px 480px at 92% 96%, rgba(11,11,15,.045), transparent 70%),
        linear-gradient(165deg, #FFFFFF 0%, #F3F4F7 50%, #E0E3E9 100%);
      background-attachment: fixed;
    }
    body { min-height: 100vh; display: flex; padding: 24px; -webkit-font-smoothing: antialiased; }
    a { color: #2F5CFF; text-decoration: none; font-weight: 700; transition: color .15s; border-radius: 4px; }
    a:hover { color: #1E44D6; text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #2F5CFF; outline-offset: 3px; }

    .wrap { margin: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { display: block; width: 420px; max-width: 100%; height: auto; }
    .card { width: 100%; max-width: 400px; background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.95); border-radius: 18px; box-shadow: 0 0 0 1px rgba(11,11,15,.05), 0 32px 70px -26px rgba(11,11,15,.24); padding: 34px 32px 28px; }
    .card h1 { font-size: 19px; font-weight: 800; color: #0B0B0F; margin-bottom: 4px; letter-spacing: -.01em; }
    .card p.sub { font-size: 12.5px; line-height: 1.5; color: #6B7080; margin-bottom: 24px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11.5px; font-weight: 700; color: #33363F; margin-bottom: 7px; }
    input { width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3E5EA; background: rgba(255,255,255,.95); color: #0B0B0F; font-size: 13px; outline: none; transition: border-color .18s, box-shadow .18s; }
    input::placeholder { color: #A3A8B5; }
    input:hover { border-color: #D2D5DC; }
    input:focus { border-color: #2F5CFF; box-shadow: 0 0 0 4px rgba(47,92,255,.12); }
    input.invalido { border-color: #FF2E4D; }
    input.valido { border-color: #00B37E; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 16px; }
    .divider-line { flex: 1; height: 1px; background: #E3E5EA; }
    .divider-text { font-size: 11px; font-weight: 700; color: #6B7080; white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
    .senha-forca { height: 3px; border-radius: 2px; margin-top: 7px; background: #E3E5EA; transition: all 0.3s; }
    .campo-dica { font-size: 11px; font-weight: 600; color: #9CA0AC; margin-top: 5px; }
    .campo-dica:empty { display: none; }

    .btn { display: block; width: 180px; max-width: 100%; margin-left: auto; margin-right: auto; height: 38px; margin-top: 8px; border-radius: 10px; border: none; background: #2F5CFF; box-shadow: 0 8px 18px -6px rgba(47,92,255,.5); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .005em; cursor: pointer; transition: transform .15s, box-shadow .2s; }
    .btn:hover { background: #1E44D6; transform: translateY(-1px); box-shadow: 0 10px 22px -6px rgba(47,92,255,.55); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid #2F5CFF; outline-offset: 3px; }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .link { text-align: center; margin-top: 16px; font-size: 12px; }
    .link a { display: inline-flex; align-items: center; gap: 5px; }

    .erro, .sucesso { display: none; padding: 10px 13px; border-radius: 10px; font-size: 12px; font-weight: 600; line-height: 1.4; margin-bottom: 14px; }
    .erro { background: #FFF0F0; border: 1px solid #F3B7C2; color: #B3123A; }
    .sucesso { background: #F2FBF7; border: 1px solid #9ADBC2; color: #00754F; }

    .sucesso-grande { text-align: center; padding: 8px 0 0; display: none; }
    .sucesso-grande .icone { width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 14px; background: rgba(47,92,255,.1); color: #2F5CFF; display: flex; align-items: center; justify-content: center; }
    .sucesso-grande h3 { font-size: 19px; font-weight: 800; color: #0B0B0F; margin-bottom: 8px; letter-spacing: -.01em; }
    .sucesso-grande p { font-size: 12.5px; line-height: 1.6; color: #6B7080; margin-bottom: 14px; }
    .sucesso-grande p strong { color: #0B0B0F; }
    .sucesso-grande .nota { font-size: 11.5px; color: #9CA0AC; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img class="brand-logo" src="/img/logo-claro.png?v=3" width="420" height="41" alt="Hub of Control"></div>
    <div class="card">
      <div id="formCadastro">
        <h1>Criar conta</h1>
        <p class="sub">Preencha os dados abaixo para se cadastrar.</p>
        <div class="erro" id="erro"></div>
        <div class="sucesso" id="sucesso"></div>
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Seu nome completo">
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" oninput="validarEmailInput()">
          <div class="campo-dica" id="emailDica"></div>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" oninput="verificarSenha()">
          <div class="senha-forca" id="forcaBarra"></div>
        </div>
        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" placeholder="Repita a senha">
        </div>
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">Dados da empresa</span>
          <div class="divider-line"></div>
        </div>
        <div class="form-group">
          <label for="nomeEmpresa">Nome da empresa</label>
          <input type="text" id="nomeEmpresa" placeholder="Nome da sua empresa">
        </div>
        <div class="form-group">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="mascaraCNPJ(this)">
          <div class="campo-dica" id="cnpjDica"></div>
        </div>
        <button class="btn" id="btnCadastro" onclick="cadastrar()">Criar conta</button>
        <div class="link"><a href="/"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Voltar para o login</a></div>
      </div>

      <!-- Tela de sucesso pós-cadastro -->
      <div class="sucesso-grande" id="telaConfirmacao">
        <div class="icone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div>
        <h3>Verifique seu e-mail</h3>
        <p>Enviamos um link de confirmação para <strong id="emailEnviado"></strong>.<br>Clique no link para ativar sua conta.</p>
        <p class="nota">Não recebeu? Verifique sua pasta de spam.</p>
        <div class="link"><a href="/"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Voltar para o login</a></div>
      </div>
    </div>
  </main>

  <script>
    function mascaraCNPJ(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 14) v = v.slice(0, 14);
      v = v.replace(/^(\d{2})(\d)/, '$1.$2');
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
      v = v.replace(/(\d{4})(\d)/, '$1-$2');
      input.value = v;
      validarCNPJInput();
    }

    function validarCNPJInput() {
      const cnpj = document.getElementById('cnpj').value.replace(/\D/g, '');
      const dica = document.getElementById('cnpjDica');
      const input = document.getElementById('cnpj');
      if (cnpj.length === 0) { dica.textContent = ''; input.className = ''; return; }
      if (cnpj.length < 14) { dica.textContent = 'CNPJ incompleto'; dica.style.color = '#9CA0AC'; input.className = ''; return; }
      if (validarCNPJ(cnpj)) {
        dica.textContent = 'CNPJ válido'; dica.style.color = '#00754F'; input.className = 'valido';
      } else {
        dica.textContent = 'CNPJ inválido'; dica.style.color = '#B3123A'; input.className = 'invalido';
      }
    }

    function validarCNPJ(cnpj) {
      if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;
      let soma = 0;
      for (let i = 1; i <= 12; i++) soma += parseInt(cnpj[i-1]) * (i < 5 ? 5 - i + 1 : 13 - i + 1);
      let resto = soma % 11;
      if (parseInt(cnpj[12]) !== (resto < 2 ? 0 : 11 - resto)) return false;
      soma = 0;
      for (let i = 1; i <= 13; i++) soma += parseInt(cnpj[i-1]) * (i < 6 ? 6 - i + 1 : 14 - i + 1);
      resto = soma % 11;
      return parseInt(cnpj[13]) === (resto < 2 ? 0 : 11 - resto);
    }

    function validarEmailInput() {
      const email = document.getElementById('email').value.trim();
      const dica = document.getElementById('emailDica');
      const input = document.getElementById('email');
      if (!email) { dica.textContent = ''; input.className = ''; return; }
      const valido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (valido) { dica.textContent = 'E-mail válido'; dica.style.color = '#00754F'; input.className = 'valido'; }
      else { dica.textContent = 'E-mail inválido'; dica.style.color = '#B3123A'; input.className = 'invalido'; }
    }

    function verificarSenha() {
      const senha = document.getElementById('senha').value;
      const barra = document.getElementById('forcaBarra');
      if (senha.length === 0) { barra.style.background = '#E3E5EA'; barra.style.width = '100%'; }
      else if (senha.length < 6) { barra.style.background = '#FF2E4D'; barra.style.width = '33%'; }
      else if (senha.length < 10) { barra.style.background = '#FFAE00'; barra.style.width = '66%'; }
      else { barra.style.background = '#00B37E'; barra.style.width = '100%'; }
    }

    async function cadastrar() {
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      const nomeEmpresa = document.getElementById('nomeEmpresa').value.trim();
      const cnpj = document.getElementById('cnpj').value.trim();
      const btn = document.getElementById('btnCadastro');
      const erro = document.getElementById('erro');
      const sucesso = document.getElementById('sucesso');
      erro.style.display = 'none'; sucesso.style.display = 'none';

      if (!nome || !email || !senha || !confirmarSenha || !nomeEmpresa || !cnpj) {
        erro.textContent = 'Preencha todos os campos.'; erro.style.display = 'block'; return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        erro.textContent = 'Informe um email válido.'; erro.style.display = 'block'; return;
      }
      if (!validarCNPJ(cnpj.replace(/\D/g, ''))) {
        erro.textContent = 'CNPJ inválido. Verifique o número informado.'; erro.style.display = 'block'; return;
      }
      if (senha.length < 6) {
        erro.textContent = 'A senha deve ter no mínimo 6 caracteres.'; erro.style.display = 'block'; return;
      }
      if (senha !== confirmarSenha) {
        erro.textContent = 'As senhas não coincidem.'; erro.style.display = 'block'; return;
      }

      btn.disabled = true; btn.textContent = 'Criando conta...';
      try {
        const res = await fetch('/api/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, nomeEmpresa, cnpj })
        });
        const data = await res.json();
        if (!res.ok) { erro.textContent = data.erro || 'Erro ao criar conta.'; erro.style.display = 'block'; return; }
        // Exibir tela de confirmação de email
        document.getElementById('formCadastro').style.display = 'none';
        document.getElementById('emailEnviado').textContent = email;
        document.getElementById('telaConfirmacao').style.display = 'block';
      } catch(err) {
        erro.textContent = 'Erro de conexão.'; erro.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Criar conta';
      }
    }

    document.addEventListener('keypress', e => { if (e.key === 'Enter') cadastrar(); });
  </script>
</body>
</html>
