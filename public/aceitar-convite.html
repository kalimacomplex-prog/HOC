<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOC - Aceitar Convite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      min-height: 100vh;
    }

    .left-panel {
      width: 420px;
      background: #1e2a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: white;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: #3b5bdb;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: white;
      margin-bottom: 24px;
    }

    .left-panel h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .left-panel p {
      font-size: 14px;
      color: #a0aec0;
      text-align: center;
      line-height: 1.6;
    }

    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 24px;
      font-weight: 700;
      color: #1e2a4a;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: #718096;
      margin-bottom: 32px;
    }

    .empresa-badge {
      display: inline-block;
      background: #ebf0ff;
      color: #3b5bdb;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e2a4a;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      color: #1e2a4a;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #3b5bdb; }
    input:disabled { background: #f8fafc; color: #a0aec0; }

    .btn {
      width: 100%;
      padding: 14px;
      background: #3b5bdb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:hover { background: #2f4ac0; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .erro {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      color: #c53030;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .sucesso {
      background: #f0fff4;
      border: 1px solid #9ae6b4;
      color: #276749;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
    }

    .senha-forca {
      height: 4px;
      border-radius: 2px;
      margin-top: 8px;
      background: #e2e8f0;
      transition: all 0.3s;
    }

    @media (max-width: 768px) {
      .left-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="logo">H</div>
    <h1>HOC System</h1>
    <p>Você foi convidado para colaborar em um projeto incrível!</p>
  </div>

  <div class="right-panel">
    <div class="card" id="cardConvite">
      <div class="loading">Verificando convite...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    async function carregarConvite() {
      const card = document.getElementById('cardConvite');

      if (!token) {
        card.innerHTML = `
          <h2>Convite inválido</h2>
          <p>Este link de convite não é válido.</p>
          <a href="/" style="color:#3b5bdb">Voltar ao login</a>
        `;
        return;
      }

      try {
        const res = await fetch(`/api/convites/${token}`);
        const data = await res.json();

        if (!res.ok) {
          card.innerHTML = `
            <h2>Convite inválido</h2>
            <p>${data.erro}</p>
            <a href="/" style="color:#3b5bdb">Voltar ao login</a>
          `;
          return;
        }

        card.innerHTML = `
          <h2>Aceitar convite</h2>
          <p>Complete seu cadastro para começar.</p>
          <div class="empresa-badge">🏢 ${data.empresa}</div>

          <div class="erro" id="erro"></div>
          <div class="sucesso" id="sucesso"></div>

          <div class="form-group">
            <label>Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome completo">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" value="${data.email}" disabled>
          </div>

          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" oninput="verificarSenha()">
            <div class="senha-forca" id="forcaBarra"></div>
          </div>

          <div class="form-group">
            <label>Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Repita a senha">
          </div>

          <button class="btn" id="btnAceitar" onclick="aceitar()">Criar minha conta</button>
        `;

      } catch (err) {
        card.innerHTML = `
          <h2>Erro</h2>
          <p>Não foi possível verificar o convite. Tente novamente.</p>
          <a href="/" style="color:#3b5bdb">Voltar ao login</a>
        `;
      }
    }

    function verificarSenha() {
      const senha = document.getElementById('senha').value;
      const barra = document.getElementById('forcaBarra');
      if (senha.length === 0) { barra.style.background = '#e2e8f0'; }
      else if (senha.length < 6) { barra.style.background = '#fc8181'; barra.style.width = '33%'; }
      else if (senha.length < 10) { barra.style.background = '#f6ad55'; barra.style.width = '66%'; }
      else { barra.style.background = '#68d391'; barra.style.width = '100%'; }
    }

    async function aceitar() {
      const nome = document.getElementById('nome').value.trim();
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      const btn = document.getElementById('btnAceitar');
      const erro = document.getElementById('erro');
      const sucesso = document.getElementById('sucesso');

      erro.style.display = 'none';
      sucesso.style.display = 'none';

      if (!nome || !senha || !confirmarSenha) {
        erro.textContent = 'Preencha todos os campos.';
        erro.style.display = 'block';
        return;
      }

      if (senha.length < 6) {
        erro.textContent = 'A senha deve ter no mínimo 6 caracteres.';
        erro.style.display = 'block';
        return;
      }

      if (senha !== confirmarSenha) {
        erro.textContent = 'As senhas não coincidem.';
        erro.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        const res = await fetch(`/api/convites/${token}/aceitar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, senha })
        });

        const data = await res.json();

        if (!res.ok) {
          erro.textContent = data.erro || 'Erro ao criar conta.';
          erro.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Criar minha conta';
          return;
        }

        sucesso.textContent = 'Conta criada! Redirecionando para o login...';
        sucesso.style.display = 'block';
        setTimeout(() => window.location.href = '/', 2000);

      } catch (err) {
        erro.textContent = 'Erro de conexão. Tente novamente.';
        erro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Criar minha conta';
      }
    }

    carregarConvite();
  </script>
</body>
</html>
