name: HOC RPA Ephemeral Runner

# Disparado pelo servidor (lib/automationEngine.js::criarMaquinaEfemera)
# quando um run de automação do builder precisa de um step "na máquina"
# (arquivo, sistema, browser) e o tenant não tem nenhuma Máquina física
# online. Esse runner se registra como uma Máquina temporária via
# heartbeat (mesmo protocolo de um agente normal) e processa os steps
# desse run até acabar ou ficar ocioso — ver public/hoc_ephemeral_runner.py.
# Também roda robôs Git/ZIP configurados como "Nuvem (GitHub Actions)".
on:
  workflow_dispatch:
    inputs:
      machine_key:
        description: "Chave temporária da Máquina efêmera"
        required: true
      hoc_api_url:
        description: "URL pública da API do HOC"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/hoc_step_executor.py
            public/hoc_ephemeral_runner.py
            public/agent.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-por poppler-utils libzbar0 ffmpeg
          pip install --no-cache-dir requests playwright psutil
          playwright install --with-deps chromium

      - name: Rodar
        working-directory: public
        env:
          HOC_API_URL: ${{ inputs.hoc_api_url }}
          HOC_MACHINE_KEY: ${{ inputs.machine_key }}
        run: python hoc_ephemeral_runner.py
