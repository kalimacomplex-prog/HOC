<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOC - Confirmar Email</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); text-align: center; }
    .icone { font-size: 64px; margin-bottom: 20px; }
    h2 { font-size: 22px; font-weight: 700; color: #1e2a4a; margin-bottom: 10px; }
    p { font-size: 13px; color: #718096; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 12px 28px; background: #2d1b69; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: #3d2b89; }
    .link { margin-top: 20px; font-size: 13px; color: #718096; }
    .link a { color: #2d1b69; font-weight: 600; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
    .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #2d1b69; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading, #sucesso, #erro { display: none; }
    #loading { display: block; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Carregando -->
    <div id="loading">
      <div class="spinner"></div>
      <h2>Verificando...</h2>
      <p>Aguarde enquanto confirmamos seu email.</p>
    </div>

    <!-- Sucesso -->
    <div id="sucesso">
      <div class="icone">✅</div>
      <h2>Email confirmado!</h2>
      <p>Sua conta foi ativada com sucesso.<br>Você já pode fazer login no HOC System.</p>
      <a href="/" class="btn">Fazer login →</a>
    </div>

    <!-- Erro -->
    <div id="erro">
      <div class="icone">❌</div>
      <h2 id="erroTitulo">Link inválido</h2>
      <p id="erroMsg">Este link de confirmação é inválido ou já foi utilizado.</p>
      <a href="/cadastro" class="btn">Criar nova conta</a>
      <div class="link">Já tem conta? <a href="/">Fazer login</a></div>
    </div>

  </div>

  <script>
    async function confirmarEmail() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        mostrarErro('Link inválido', 'Nenhum token de confirmação foi encontrado na URL.');
        return;
      }

      try {
        const res = await fetch(`/api/confirmar-email/${token}`);
        const data = await res.json();
        if (res.ok) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('sucesso').style.display = 'block';
          // Redirecionar automaticamente após 3s
          setTimeout(() => window.location.href = '/', 3000);
        } else {
          mostrarErro('Link inválido ou expirado', data.erro || 'Este link de confirmação não é válido.');
        }
      } catch(err) {
        mostrarErro('Erro de conexão', 'Não foi possível verificar seu email. Tente novamente.');
      }
    }

    function mostrarErro(titulo, msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('erroTitulo').textContent = titulo;
      document.getElementById('erroMsg').textContent = msg;
      document.getElementById('erro').style.display = 'block';
    }

    confirmarEmail();
  </script>
</body>
</html>
