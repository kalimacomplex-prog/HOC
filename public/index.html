<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>HOC - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 12% 8%, rgba(47,92,255,.055), transparent 70%),
      radial-gradient(800px 480px at 92% 96%, rgba(11,11,15,.045), transparent 70%),
      linear-gradient(165deg, #FFFFFF 0%, #F3F4F7 50%, #E0E3E9 100%);
    -webkit-font-smoothing: antialiased;
  }
  a { color: #2F5CFF; text-decoration: none; transition: color .15s; border-radius: 4px; }
  a:hover { color: #1E44D6; text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid #2F5CFF; outline-offset: 3px; }

  /* ---------- Cena 3D ---------- */
  .scene-mask {
    position: fixed; inset: 0; pointer-events: none;
    /* área limpa atrás do título — acompanha o .brand (ver updateMask) */
    -webkit-mask-image: radial-gradient(ellipse 300px 56px at 50% var(--title-y, 22%), transparent 0%, transparent 68%, #000 100%);
            mask-image: radial-gradient(ellipse 300px 56px at 50% var(--title-y, 22%), transparent 0%, transparent 68%, #000 100%);
    animation: fadeIn 1.1s ease-out both;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 55%, rgba(237,239,242,.8) 100%),
                linear-gradient(to bottom, rgba(255,255,255,.55) 0%, transparent 11%);
  }

  /* ---------- Login ---------- */
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 2; padding: 16px 24px; }
  .brand { display: flex; align-items: center; gap: 12px; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .brand-logo { display: block; width: 420px; max-width: 100%; height: auto; }
  .card { width: 380px; max-width: 100%; background: rgba(255,255,255,.9); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15); border: 1px solid rgba(255,255,255,.95); border-radius: 18px; box-shadow: 0 0 0 1px rgba(11,11,15,.05), 0 32px 70px -26px rgba(11,11,15,.24); padding: 34px 32px 28px; animation: rise .75s .08s cubic-bezier(.2,.7,.2,1) both; }
  .card h1 { font-size: 19px; font-weight: 800; color: #0B0B0F; margin: 0 0 22px; letter-spacing: -.01em; }
  .lbl { display: block; font-size: 11.5px; font-weight: 700; color: #33363F; margin-bottom: 7px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .row .lbl { flex: 1; margin: 0; }
  .row a { font-size: 11.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .inp { width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3E5EA; background: rgba(255,255,255,.95); color: #0B0B0F; font-size: 13px; outline: none; transition: border-color .18s, box-shadow .18s; }
  .inp::placeholder { color: #A3A8B5; }
  .inp:hover { border-color: #D2D5DC; }
  .inp:focus { border-color: #2F5CFF; box-shadow: 0 0 0 4px rgba(47,92,255,.12); }
  .mb14 { margin-bottom: 14px; } .mb20 { margin-bottom: 22px; }
  .btn { display: block; width: 180px; max-width: 100%; margin-left: auto; margin-right: auto; height: 38px; border-radius: 10px; border: none; background: #2F5CFF; box-shadow: 0 8px 18px -6px rgba(47,92,255,.5); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .005em; cursor: pointer; transition: transform .15s, box-shadow .2s; }
  .btn:hover { background: #1E44D6; transform: translateY(-1px); box-shadow: 0 10px 22px -6px rgba(47,92,255,.55); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid #2F5CFF; outline-offset: 3px; }
  .forgot { display: block; width: fit-content; margin: 16px auto 0; font-size: 12px; font-weight: 700; color: #0B0B0F; }
  .forgot:hover { color: #33363F; }
  .foot { text-align: center; font-size: 12px; color: #6B7080; margin-top: 14px; }
  .foot a { font-weight: 700; color: #2F5CFF; }
  .foot a:hover { color: #1E44D6; }

  .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .erro { display: none; padding: 10px 13px; border-radius: 10px; font-size: 12px; font-weight: 600; line-height: 1.4; margin-bottom: 14px; }
  .erro { background: #FFF0F0; border: 1px solid #F3B7C2; color: #B3123A; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .scene-mask, .brand, .card { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>

<div class="scene-mask" id="mask" aria-hidden="true">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div class="vignette" aria-hidden="true"></div>

<main class="wrap">
  <div class="brand" id="brand"><img class="brand-logo" src="/img/logo-claro.png?v=3" width="420" height="41" alt="Hub of Control"></div>
  <form class="card" onsubmit="event.preventDefault(); login()" novalidate>
    <h1>Boas vindas!</h1>
    <div class="erro" id="erro"></div>
    <label class="lbl" for="email">E-mail</label>
    <input class="inp mb14" id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    <label class="lbl" for="senha">Senha</label>
    <input class="inp mb20" id="senha" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" type="submit" id="btnLogin">Entrar</button>
    <a class="forgot" href="/recuperar-senha">Esqueci minha senha</a>
    <div class="foot"><a href="/cadastro">Criar conta</a></div>
  </form>
</main>

<script>
/* =========================================================
   Fundo 3D do login — blocos sólidos desenhados direto em tela.
   Posições fixas (sem aleatoriedade): coordenadas (u,v) no piso, em torno do centro da cena,
   onde u = ao longo do fluxo principal e v = perpendicular.
   Cada ponto do piso é projetado para a tela por `proj` (mesma matemática do CSS:
   scale · rotateX · rotateZ(-40°) · perspective 1500), e tudo vira SVG vetorial em pixels reais,
   então os contornos ficam sempre nítidos (nada é rasterizado e depois esticado).
   ========================================================= */
(function () {
  const BLUE = '#2F5CFF', GL = '#BEC3CB';
  const CYCLE = 3.6, ARRIVE = 0.32;      // ciclo (s) e fração em que o sinal chega ao cilindro
  const TUCK = 3;                      // quanto a linha entra sob o elemento (sem pontas visíveis)
  const HZ = 13;                       // altura de todos os blocos (px no piso)
  const DEG = Math.PI / 180, c40 = Math.cos(40 * DEG), s40 = Math.sin(40 * DEG);
  const svg = document.getElementById('scene');

  // ícones Lucide (https://lucide.dev)
  const I = {
    brain: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>',
    bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
    branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
    task: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/>',
    db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>'
  };

  // cores: topo em degradê, lateral sólida (um tom só)
  const COL = {
    blue: { top: 'url(#gB)', side: 'url(#wB)', ic: '#FFFFFF', bar: 'rgba(255,255,255,.6)' },
    ink:  { top: 'url(#gI)', side: 'url(#wI)', ic: '#FFFFFF', bar: 'rgba(255,255,255,.5)' },
    gray: { top: 'url(#gG)', side: 'url(#wG)', ic: '#FFFFFF', bar: 'rgba(255,255,255,.5)' }
  };
  // formas: pontos internos + raio (o contorno é o casco convexo dos círculos de raio r em cada ponto)
  const R = (a, b, r) => ({ pts: [[-a, -b], [a, -b], [a, b], [-a, b]], r, hw: a + r, hh: b + r });
  const SH = {
    sq96: R(22, 22, 26),
    sq76: R(16, 16, 22),
    sq88: R(20, 20, 24),
    sq112: R(28, 28, 28),
    wide: R(46, 12, 20),
    circ: { pts: [[0, 0]], r: 50, hw: 50, hh: 50 },
    dia:  { pts: [[26, 0], [0, 26], [-26, 0], [0, -26]], r: 10, hw: 36, hh: 36 }
  };

  // elementos (posição em u,v) — o cilindro final é tratado à parte
  const AG = 600;
  const N = {
    brain: { p: [-610, 0],   sh: 'sq96', st: 'blue', ic: 'brain',  is: 2.7 },
    d1:    { p: [-390, 0],   sh: 'dia',  st: 'gray', ic: 'branch', is: 1.1 },
    trig:  { p: [AG + 200, -240], sh: 'circ', st: 'ink', ic: 'zap',    is: 2.0 },
    db2:   { p: [-390, 230], sh: 'sq76', st: 'ink',  ic: 'db',     is: 2.0 },
    agent: { p: [AG, 0],     sh: 'sq112', st: 'blue', ic: 'bot',   is: 3.6 },
    usr:   { p: [120, 330], sh: 'sq88', st: 'ink',  ic: 'user',   is: 2.5 },
    t2:    { p: [-390, -330], sh: 'wide', st: 'ink',  ic: 'task',   is: 1.7, bars: true }
  };
  const END = [1060, 0], ER = 54;   // cilindro final
  const ids = Object.keys(N);

  // ---------- projeção ----------
  const TILT0 = 46;                    // inclinação do piso (quanto menor, mais "de cima" a visão)
  let W = innerWidth, H = innerHeight, S = 1, cT = Math.cos(TILT0 * DEG), sT = Math.sin(TILT0 * DEG);
  const proj = (u, v, z) => {
    const x1 = u * c40 + v * s40, y1 = -u * s40 + v * c40;
    const y2 = y1 * cT - z * sT, z2 = y1 * sT + z * cT, k = 1500 / (1500 - z2), oy = H * 0.4;
    return [W / 2 + S * x1 * k, oy + (H / 2 + S * y2 - oy) * k];
  };
  const P = (q, z) => proj(q[0], q[1], z || 0);

  // ---------- geometria ----------
  const hull = (pts) => {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (const q of p.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  };
  const outlines = {};
  const outline = (sh) => outlines[sh] || (outlines[sh] = (() => {
    const s = SH[sh], pts = [];
    for (const [cx, cy] of s.pts) for (let a = 0; a < 360; a += 4) { const t = a * DEG; pts.push([cx + s.r * Math.cos(t), cy + s.r * Math.sin(t)]); }
    return hull(pts);
  })());
  const f2 = (n) => n.toFixed(2);
  const pathOf = (pts) => 'M' + pts.map(q => `${f2(q[0])} ${f2(q[1])}`).join('L') + 'Z';
  const edge = (id, side) => {
    const n = N[id], s = SH[n.sh], [x, y] = n.p;
    return side === 'r' ? [x + s.hw, y] : side === 'l' ? [x - s.hw, y] : side === 't' ? [x, y - s.hh] : [x, y + s.hh];
  };
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const unit = (a, b) => { const d = dist(a, b) || 1; return [(b[0] - a[0]) / d, (b[1] - a[1]) / d]; };
  const plen = (pts) => pts.slice(1).reduce((s, q, i) => s + dist(pts[i], q), 0);
  const xy = (q) => `${f2(q[0])} ${f2(q[1])}`;
  const f4 = (n) => n.toFixed(4);

  // trajeto no piso (reto ou com canto arredondado), já projetado: devolve caminho SVG e pontos para medir
  const routeOf = (a, c, b, r) => {
    if (!c) return { d: `M${xy(P(a))} L${xy(P(b))}`, pts: [P(a), P(b)] };
    const dx1 = Math.sign(c[0] - a[0]), dy1 = Math.sign(c[1] - a[1]), dx2 = Math.sign(b[0] - c[0]), dy2 = Math.sign(b[1] - c[1]);
    const p1 = [c[0] - dx1 * r, c[1] - dy1 * r], p2 = [c[0] + dx2 * r, c[1] + dy2 * r];
    return { d: `M${xy(P(a))} L${xy(P(p1))} Q${xy(P(c))} ${xy(P(p2))} L${xy(P(b))}`, pts: [P(a), P(c), P(b)] };
  };


  const rr = (u0, u1, v0, v1, r, z) => { const pts = []; for (const [cu, cv, a0] of [[u1 - r, v1 - r, 0], [u0 + r, v1 - r, 90], [u0 + r, v0 + r, 180], [u1 - r, v0 + r, 270]]) for (let a = a0; a <= a0 + 90; a += 5) pts.push(proj(cu + r * Math.cos(a * DEG), cv + r * Math.sin(a * DEG), z || 0)); return pts; };
  const decoFor = (k) => {
    if (k === 'A') return `<defs><linearGradient id="fa" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="${H}"><stop offset="0" stop-color="#F7F8FA"/><stop offset="1" stop-color="#D3D7DF"/></linearGradient><filter id="fb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter></defs><path d="${pathOf(rr(-1000, 1300, -620, 620, 260))}" fill="url(#fa)" filter="url(#fb)" opacity=".95"/>`;
    if (k === 'B') { let g = ''; for (let u = -1600; u <= 1800; u += 130) g += `M${xy(P([u, -1000]))}L${xy(P([u, 1000]))}`; for (let v = -1000; v <= 1000; v += 130) g += `M${xy(P([-1600, v]))}L${xy(P([1800, v]))}`; return `<defs><radialGradient id="gr" gradientUnits="userSpaceOnUse" cx="${W / 2}" cy="${H * 0.52}" r="${W * 0.62}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="gm"><rect width="${W}" height="${H}" fill="url(#gr)"/></mask></defs><path d="${g}" fill="none" stroke="rgba(11,11,15,.10)" stroke-width="1" mask="url(#gm)"/>`; }
    if (k === 'C') { let g = ''; [180, 340, 500, 660, 820, 980].forEach((r, i) => { const pts = []; for (let a = 0; a < 360; a += 4) pts.push(proj(END[0] * 0 + r * Math.cos(a * DEG), r * Math.sin(a * DEG), 0)); g += `<path d="${pathOf(pts)}" fill="none" stroke="rgba(47,92,255,${(0.16 - i * 0.022).toFixed(3)})" stroke-width="1.4"/>`; }); return g; }
    if (k === 'D') { const o = rr(-760, 1180, -470, 430, 90, 0), top = o.map(q => [q[0], q[1]]); const lift = (pts, z) => rr(-760, 1180, -470, 430, 90, z); const base = rr(-760, 1180, -470, 430, 90, 0), t = rr(-760, 1180, -470, 430, 90, 7); return `<defs><linearGradient id="da" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F9FB"/><stop offset="1" stop-color="#E4E7EC"/></linearGradient><filter id="db" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter></defs><path d="${pathOf(rr(-760, 1180, -470, 430, 90, 0).map(q => [q[0] + 14, q[1] + 34]))}" fill="rgba(11,11,15,.14)" filter="url(#db)"/><path d="${pathOf(hull(base.concat(t)))}" fill="#D3D8E0"/><path d="${pathOf(t)}" fill="url(#da)"/>`; }
    return '';
  };
  // ---------- montagem da cena (refeita no resize, sem reiniciar a animação) ----------
  let cw, ct, cb, g0, g1;
  const build = () => {
    let linesSvg = '', fxSvg = '';
    // linha: termina encostada (levemente sob) a borda do elemento — sem anéis nem bolinhas
    const wire = (a, c, b, col, w, r) => {
      const ua = unit(a, c || b), ub = unit(c || a, b);
      const a2 = [a[0] - ua[0] * TUCK, a[1] - ua[1] * TUCK], b2 = [b[0] + ub[0] * TUCK, b[1] + ub[1] * TUCK];
      linesSvg += `<path d="${routeOf(a2, c, b2, r).d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
      return b2;
    };
    // sinal: ponto com halo + rastro suave, viajando entre as frações a→b do ciclo
    const signal = (path, a, b, big, tail) => {
      const kt = `0;${f4(a)};${f4(b)};1`, kt5 = `0;${f4(a + .004)};${f4(b - .018)};${f4(b)};1`, rs = Math.max(S, .7);
      const dot = (r, o) => `<ellipse rx="${f2(r * rs * 1.05)}" ry="${f2(r * rs * .8)}" fill="${BLUE}" opacity="0"><animateMotion dur="${CYCLE}s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="${kt}" calcMode="linear" path="${path}"/><animate attributeName="opacity" values="0;${o};${o};0;0" keyTimes="${kt5}" dur="${CYCLE}s" repeatCount="indefinite"/></ellipse>`;
      const streak = `<path d="${path}" pathLength="1" fill="none" stroke="${BLUE}" stroke-width="${big ? 3 : 2.5}" stroke-linecap="round" stroke-dasharray="${tail} 3" stroke-dashoffset="${tail}" stroke-opacity="0"><animate attributeName="stroke-dashoffset" values="${tail};${tail};${(tail - 1).toFixed(3)};${(tail - 1).toFixed(3)}" keyTimes="${kt}" dur="${CYCLE}s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;.5;.5;0;0" keyTimes="${kt5}" dur="${CYCLE}s" repeatCount="indefinite"/></path>`;
      fxSvg += `<g class="fx">${streak}${dot(big ? 20 : 14, .15)}${dot(big ? 7 : 5, 1)}</g>`;
    };

    // fluxo principal (azul): cérebro → decisão → agente → cilindro
    const mainA = N.brain.p, mainB = [END[0] - ER, 0];
    const mainLen = dist(P(mainA), P(mainB)), speed = ARRIVE / mainLen;     // fração do ciclo por px de tela
    wire(edge('brain', 'r'), null, edge('d1', 'l'), BLUE, 3);
    wire(edge('d1', 'r'), null, edge('agent', 'l'), BLUE, 3);
    wire(edge('agent', 'r'), null, mainB, BLUE, 3, 0);
    signal(routeOf(mainA, null, mainB).d, 0, ARRIVE, true, .08);

    // ramais (cinza): o sinal azul se divide na bifurcação e segue também pelo ramal
    const BR = 0.62;                                   // ramais um pouco mais lentos que o principal
    const branch = (from, fs, to, ts, via, r, t0) => {
      const a = edge(from, fs), b = edge(to, ts), ctr = N[from].p;
      const bEnd = wire(a, via, b, GL, 2.4, r);
      const rt = routeOf(ctr, via, bEnd, r), dur = plen(rt.pts) * speed / BR;
      signal(rt.d, t0, t0 + dur, false, .14);
    };
    const tAt = (id) => speed * dist(P(mainA), P(N[id].p));
    branch('d1', 't', 't2', 'b', null, 0, tAt('d1'));
    branch('d1', 'b', 'db2', 't', null, 0, tAt('d1'));
    branch('agent', 't', 'trig', 'l', [N.agent.p[0], N.trig.p[1]], 40, tAt('agent'));
    branch('agent', 'b', 'usr', 'r', [N.agent.p[0], N.usr.p[1]], 44, tAt('agent'));

    // sombras (borradas) e blocos, do fundo para a frente
    const order = ids.slice().sort((a, b) => P(N[a].p)[1] - P(N[b].p)[1]);
    const SD = [10, 15], SHD = 'rgba(11,11,15,.2)';
    const shadows = order.map(id => `<path d="${pathOf(outline(N[id].sh).map(q => P([N[id].p[0] + q[0] + SD[0], N[id].p[1] + q[1] + SD[1]])))}" fill="${SHD}"/>`).join('')
      + `<path d="${pathOf(circle(END[0] + SD[0], END[1] + SD[1], 0))}" fill="${SHD}"/>`;
    const block = (id) => {
      const n = N[id], c = COL[n.st], o = outline(n.sh), [pu, pv] = n.p;
      const base = o.map(q => P([pu + q[0], pv + q[1]], 0)), top = o.map(q => P([pu + q[0], pv + q[1]], HZ)), wall = hull(base.concat(top));
      const O0 = P(n.p, HZ), ex = P([pu + 1, pv], HZ), ey = P([pu, pv + 1], HZ);
      // ícones e barras seguem a orientação do bloco (alinhados ao piso)
      const m = [ex[0] - O0[0], ex[1] - O0[1], ey[0] - O0[0], ey[1] - O0[1], O0[0], O0[1]].map(f4).join(' ');
      const sc = n.is, off = n.bars ? -38 : 0, kk = (dist(O0, ex) + dist(O0, ey)) / 2;   // espessura do traço constante na tela (robô = cérebro)
      let ic = `<g transform="translate(${off - 12 * sc} ${-12 * sc}) scale(${sc})" fill="none" stroke="${c.ic}" stroke-width="${((c === COL.blue ? 2.4 : 2.1) / (sc * kk)).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">${I[n.ic]}</g>`;
      if (n.bars) ic += `<rect x="${off + 24}" y="-11" width="48" height="7" rx="3.5" fill="${c.bar}"/><rect x="${off + 24}" y="4" width="30" height="7" rx="3.5" fill="${c.bar}" opacity=".7"/>`;
      // faixa de luz recuada, só nas faces voltadas para a câmera e esmaecendo nas laterais (nunca encosta na borda)
      const led = o.map(q => P([pu + q[0] * .965, pv + q[1] * .965], HZ * 0.5));
      let ar = 0; for (let k = 0; k < led.length; k++) { const a = led[k], b = led[(k + 1) % led.length]; ar += a[0] * b[1] - b[0] * a[1]; }
      const sg = ar > 0 ? 1 : -1; let ledSvg = '';
      for (let k = 0; k < led.length; k++) {
        const a = led[k], b = led[(k + 1) % led.length], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ny = sg * (-dx) / L;
        const w = Math.max(0, ny - .25) / .75; if (w <= .02) continue;
        ledSvg += `<path d="M${f2(a[0])} ${f2(a[1])}L${f2(b[0])} ${f2(b[1])}" stroke="#EEF2FF" stroke-opacity="${(.62 * w * w).toFixed(2)}" stroke-width="1.1" stroke-linecap="butt" fill="none"/>`;
      }
      return `<path d="${pathOf(wall)}" fill="${c.side}"/>${ledSvg}<path d="${pathOf(top)}" fill="${c.top}"/><g transform="matrix(${m})">${ic}</g>`;
    };
    const defs = `<defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${f2(9 * Math.max(S, .6))}"/></filter>`
      + '<linearGradient id="wB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F4FD8"/><stop offset="1" stop-color="#1A2D9C"/></linearGradient>'
      + '<linearGradient id="wI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1F25"/><stop offset="1" stop-color="#07070A"/></linearGradient>'
      + '<linearGradient id="wG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#383A42"/><stop offset="1" stop-color="#1D1F24"/></linearGradient>'
      + '<linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F79FF"/><stop offset="1" stop-color="#2547D6"/></linearGradient>'
      + '<linearGradient id="gI" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30323A"/><stop offset="1" stop-color="#0B0B0F"/></linearGradient>'
      + '<linearGradient id="gG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#555862"/><stop offset="1" stop-color="#3A3C44"/></linearGradient>'
      + '<linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop id="gC0" offset="0" stop-color="#30323A"/><stop id="gC1" offset="1" stop-color="#0B0B0F"/></linearGradient></defs>';
    svg.innerHTML = defs + decoFor('B') + `<g filter="url(#bl)">${shadows}</g>` + linesSvg + fxSvg + order.map(block).join('')
      + '<path id="cb" fill="#08080B"/><path id="cw" fill="#08080B"/><path id="ct" fill="url(#gC)"/>';
    cw = svg.querySelector('#cw'); ct = svg.querySelector('#ct'); cb = svg.querySelector('#cb');
    g0 = svg.querySelector('#gC0'); g1 = svg.querySelector('#gC1');
    cb.setAttribute('d', pathOf(circle(END[0], END[1], 0)));
    if (reduce) svg.querySelectorAll('.fx').forEach(e => e.remove());
  };
  // círculo (raio ER) no piso, na altura z, projetado
  const circle = (u, v, z) => { const pts = []; for (let a = 0; a < 360; a += 6) pts.push(proj(u + ER * Math.cos(a * DEG), v + ER * Math.sin(a * DEG), z)); return pts; };

  // ---------- animação do cilindro (sincronizada com o sinal azul via SVG time) ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => x * x * (3 - 2 * x);
  const back = (x) => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
  const wallInk = [8, 8, 11], wallGr = [0, 112, 78], topInkA = [48, 50, 58], topInkB = [11, 11, 15], topGrA = [30, 200, 150], topGrB = [0, 135, 95];
  const H0 = HZ, H1 = HZ * 3.3;   // altura em repouso (igual à dos blocos) / ativo
  const tick = () => {
    let t = 0;
    if (!reduce) { try { t = ((svg.getCurrentTime() % CYCLE) / CYCLE); } catch (e) { t = (performance.now() / (CYCLE * 1000)) % 1; } }
    const fill = 1;                                                                      // o cilindro já nasce verde e só cresce
    const up = back(clamp((t - 0.33) / 0.15));                                           // cresce com leve "mola"
    const down = ease(clamp((t - 0.72) / 0.13));                                         // volta ao tamanho
    const h = H0 + (H1 - H0) * clamp(up) * (1 - down) + (up > 1 ? (up - 1) * (H1 - H0) * (1 - down) : 0);
    if (cw) {
      const top = circle(END[0], END[1], h);
      cw.setAttribute('d', pathOf(hull(circle(END[0], END[1], 0).concat(top))));
      ct.setAttribute('d', pathOf(top));
      const wc = rgb(mix(wallInk, wallGr, fill));
      cw.setAttribute('fill', wc); cb.setAttribute('fill', wc);
      g0.setAttribute('stop-color', rgb(mix(topInkA, topGrA, fill)));
      g1.setAttribute('stop-color', rgb(mix(topInkB, topGrB, fill)));
    }
    requestAnimationFrame(tick);
  };

  // ---------- escala da cena e área limpa atrás do título ----------
  const mask = document.getElementById('mask'), brand = document.getElementById('brand');
  const keyPts = () => ids.map(id => N[id].p).concat([END]);
  const fit = () => {
    W = innerWidth; H = innerHeight;
    const S0 = Math.max(0.45, Math.min(1.25, W / 1500));
    // em janelas baixas a inclinação do piso aumenta (e, se preciso, a escala diminui) até a cena caber na altura
    const fits = () => { const ys = keyPts().map(q => P(q)[1]); return Math.min(...ys) - 55 >= 8 && Math.max(...ys) + 62 <= H - 8; };
    let ok = false;
    for (S = S0; S >= 0.45 && !ok; S *= 0.97) {
      for (let tilt = TILT0; tilt <= 62 && !ok; tilt++) { cT = Math.cos(tilt * DEG); sT = Math.sin(tilt * DEG); ok = fits(); }
    }
    S = Math.max(0.45, S / 0.97);
    window.__scene = { S, W, H, tilt: Math.round(Math.acos(cT) / DEG) };
    build();
    const b = brand.getBoundingClientRect();
    mask.style.setProperty('--title-y', `${Math.round(b.top + b.height / 2)}px`);
  };
  fit();
  tick();
  addEventListener('resize', fit);
})();
</script>
<script>
  if (localStorage.getItem('token')) window.location.href = '/overview';

  let redirecionando = false;
  async function login() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('btnLogin');
    const erro = document.getElementById('erro');
    erro.style.display = 'none';
    if (!email || !senha) { erro.textContent = 'Preencha todos os campos.'; erro.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Entrando...';
    try {
      const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, senha }) });
      const data = await res.json();
      if (!res.ok) { erro.textContent = data.erro || 'Erro ao fazer login.'; erro.style.display = 'block'; return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('usuario', JSON.stringify(data.usuario));
      redirecionando = true;
      window.location.href = '/overview';
    } catch(err) { erro.textContent = 'Erro de conexão.'; erro.style.display = 'block'; }
    finally { if (!redirecionando) { btn.disabled = false; btn.textContent = 'Entrar'; } }
  }
</script>
</body>
